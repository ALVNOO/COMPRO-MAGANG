services:

  app:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: log
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated queue worker (scales independently from web app)
  queue:
    build:
      context: .
      target: production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=high,default
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: log
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  storage_data:
  logs:
