# ── Load Balancing Reference Configuration ───────────────────────────────────
# For self-hosted multi-instance deployments.
# Railway/Render/Fly.io handle this layer automatically.
#
# Prerequisites:
#   - SESSION_DRIVER=redis and CACHE_STORE=redis (app is stateless across instances)
#   - All instances share the same Redis and database

upstream laravel_app {
    least_conn;                        # Route to instance with fewest active connections
    server app_1:9000 weight=1 max_fails=3 fail_timeout=30s;
    server app_2:9000 weight=1 max_fails=3 fail_timeout=30s;
    server app_3:9000 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    root /var/www/html/public;
    index index.php;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
    }

    location /build {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check bypass (used by load balancer probes)
    location /api/ping {
        fastcgi_pass laravel_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        access_log off;
    }
}
