[www]
user  = www-data
group = www-data

; Listen on TCP (matches nginx fastcgi_pass 127.0.0.1:9000)
listen = 127.0.0.1:9000

; Dynamic process manager — scales between min and max as load demands.
; Tuned for Railway hobby/starter constraints (~512 MB RAM total).
pm                   = dynamic
pm.max_children      = 3
pm.start_servers     = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle workers after N requests to guard against memory leaks.
pm.max_requests = 200

; Kill a worker if it hasn't responded in 60 s (prevents hung workers
; from blocking the whole pool and causing 502s).
request_terminate_timeout = 60s

; Pass real client IP from nginx into the PHP environment.
clear_env = no
